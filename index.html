<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="author" content="Nesisoft Team" />
        <meta name="theme-color" content="#0f0f12" />
        <meta name="color-scheme" content="dark" />

        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <link rel="alternate" type="application/rss+xml" title="Nesisoft Blog" href="/rss.xml" />

        <!-- Fonts, none of them blocking the first paint (see src/index.css).
             Satoshi: Fontshare's stylesheet (one variable font file for all
             weights) applied once it has loaded. -->
        <link rel="preconnect" href="https://api.fontshare.com" />
        <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
        <link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=satoshi@1&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
        <noscript><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@1&display=swap" /></noscript>
        <!-- The mono face used in the first screen's labels. -->
        <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/ibm-plex-mono/ibm-plex-mono-500-latin.woff2" crossorigin />

        <!-- seo -->
        <!-- The tags the <Seo> component manages, with the homepage's values.
             Prerendered pages get their own: the build replaces everything
             between the seo markers (scripts/prerender-plugin.ts). -->
        <title>Software &amp; App Development Company in Accra, Ghana | Nesisoft</title>
        <meta name="description" content="Nesisoft is a software development company in Accra, Ghana, building web platforms, mobile apps and custom software for businesses across Africa." />
        <link rel="canonical" href="https://www.nesisoft.com/" />

        <meta property="og:site_name" content="Nesisoft" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:title" content="Software &amp; App Development Company in Accra, Ghana | Nesisoft" />
        <meta property="og:description" content="Nesisoft is a software development company in Accra, Ghana, building web platforms, mobile apps and custom software for businesses across Africa." />
        <meta property="og:url" content="https://www.nesisoft.com/" />
        <meta property="og:type" content="website" />
        <meta property="og:image" content="https://www.nesisoft.com/og-image.png" />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:site" content="@nesisoft_inc" />
        <meta name="twitter:title" content="Software &amp; App Development Company in Accra, Ghana | Nesisoft" />
        <meta name="twitter:description" content="Nesisoft is a software development company in Accra, Ghana, building web platforms, mobile apps and custom software for businesses across Africa." />
        <meta name="twitter:image" content="https://www.nesisoft.com/og-image.png" />
        <!-- /seo -->
    </head>


  <body style="background:#09090b;margin:0">
    <div id="root">
      <!-- Boot loader: visible while the JS bundle downloads, then React's
           first render replaces it. Matches the in-app RouteFallback.
           Prerendered pages put their content here instead and keep the
           loader outside #root, hidden (scripts/prerender-plugin.ts). -->
      <div class="nesisoft-boot">
        <div class="nesisoft-boot__row">
          <span class="nesisoft-boot__dot">
            <span class="nesisoft-boot__ping"></span>
          </span>
          <span class="nesisoft-boot__text">
            ENGINEERING, TECHNOLOGIES AND MORE<span class="nesisoft-boot__ellipsis">…</span>
          </span>
        </div>
        <div class="nesisoft-boot__bar"><span></span></div>
      </div>
      <style>
        .nesisoft-boot {
          position: fixed; inset: 0; z-index: 100;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: #09090b;
          font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .nesisoft-boot__row { display: flex; align-items: center; gap: 12px; }
        .nesisoft-boot__dot {
          position: relative; display: inline-flex; width: 8px; height: 8px;
        }
        .nesisoft-boot__dot::after {
          content: ""; position: absolute; inset: 0;
          background: #a78bfa; border-radius: 999px;
        }
        .nesisoft-boot__ping {
          position: absolute; inset: 0;
          background: #a78bfa; border-radius: 999px; opacity: .75;
          animation: nesisoft-ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        .nesisoft-boot__text {
          font-family: ui-monospace, "SFMono-Regular", "Menlo", "Monaco", "Consolas", monospace;
          font-size: 12px; letter-spacing: 0.32em; color: #d4d4d8;
        }
        @media (min-width: 640px) { .nesisoft-boot__text { font-size: 14px; } }
        .nesisoft-boot__ellipsis {
          display: inline-block; animation: nesisoft-pulse 1.5s ease-in-out infinite;
        }
        .nesisoft-boot__bar {
          margin-top: 24px; width: 160px; height: 1px; overflow: hidden;
          background: rgba(255,255,255,0.1);
        }
        .nesisoft-boot__bar > span {
          display: block; width: 33%; height: 100%;
          background: #a78bfa;
          animation: nesisoft-slide 1.2s ease-in-out infinite;
        }
        @keyframes nesisoft-ping {
          75%, 100% { transform: scale(2.4); opacity: 0; }
        }
        @keyframes nesisoft-pulse {
          0%, 100% { opacity: 1; } 50% { opacity: .35; }
        }
        @keyframes nesisoft-slide {
          0%   { transform: translateX(-100%); }
          50%  { transform: translateX(200%); }
          100% { transform: translateX(-100%); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
